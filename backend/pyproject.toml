[project]
name = "backend"
version = "0.1.0"
description = "DuoSigna Backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "bcrypt==3.2.2",
    "fastapi>=0.115.0",
    "nltk>=3.9.1",
    "pandas>=2.2.0",
    "passlib>=1.7.4",
    "psycopg2-binary>=2.9.10",
    "pydantic>=2.10.0",
    "pyjwt>=2.9.0",
    "python-dotenv>=1.0.1",
    "python-multipart>=0.0.12",
    "requests>=2.32.0",
    "scikit-learn==1.6.1",
    "sentence-transformers>=3.0.0",
    "sqlalchemy>=2.0.36",
    "tensorflow-cpu>=2.16.0",
    "torch>=2.4.0",
    "uvicorn>=0.32.0",
    "yt-dlp>=2024.10.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
